name: Install project
description: Set up uv and Python, then install the locked project and development dependencies.

runs:
  using: composite

  steps:
    - name: Set up uv and Python
      uses: astral-sh/setup-uv@v10.3.3
      with:
        version: "0.8.22"
        python-version: "3.11"
        enable-cache: true

    - name: Install project and development dependencies
      shell: bash
      run: uv sync --locked --extra dev --group test
