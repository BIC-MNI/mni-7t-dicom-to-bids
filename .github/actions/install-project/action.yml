name: Install MNI 7T BIDS converter
description: Install the MNI 7T BIDS converter and all its dependencies.

runs:
  using: composite

  steps:
    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version: 3.11
        cache: pip

    - name: Install MNI 7T BIDS converter
      shell: bash
      run: pip install .[dev]
