name: Checks

on:
  push:
    branches: [main, 'release-*']
  pull_request:
    branches: [main, 'release-*']

permissions:
  contents: read

jobs:
  tests:
    name: Unit tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Check out MNI 7T BIDS converter
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Install project
        uses: ./.github/actions/install-project

      - name: Run Unit tests
        run: uv run --locked --extra dev --group test pytest

  ruff:
    name: Lints
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Check out MNI 7T BIDS converter
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Install project
        uses: ./.github/actions/install-project

      - name: Run Lints
        run: uv run --locked --extra dev --group test ruff check --output-format=github

  pyright:
    name: Type checks
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Check out MNI 7T BIDS converter
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Install project
        uses: ./.github/actions/install-project

      - name: Run Type checks
        run: uv run --locked --extra dev --group test pyright

  typos:
    name: Typos
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Check out MNI 7T BIDS converter
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Install project
        uses: ./.github/actions/install-project

      - name: Run Typos
        run: uv run --locked --extra dev --group test typos

  containers:
    name: Containers
    runs-on: ubuntu-24.04

    steps:
    - name: Check out MNI 7T BIDS converter
      uses: actions/checkout@v7

    - name: Install project
      uses: ./.github/actions/install-project

    - name: Build Docker image
      run: docker build --tag mni7t-dcm2bids:test .

    - name: Test Docker image
      run: docker run --rm mni7t-dcm2bids:test --version

    - name: Install Apptainer
      run: |
        sudo add-apt-repository -y ppa:apptainer/ppa
        sudo apt-get update
        sudo apt-get install -y apptainer

    - name: Convert Docker image to SIF
      run: |
        docker save --output mni7t-dcm2bids.tar mni7t-dcm2bids:test
        apptainer build mni7t-dcm2bids.sif docker-archive:"$PWD/mni7t-dcm2bids.tar"

    - name: Test Apptainer image
      run: apptainer run --cleanenv mni7t-dcm2bids.sif --version
