[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mni_7t_dicom_to_bids"
version = "0.2.0"
readme = "README.md"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
requires-python = ">= 3.11"
dependencies = [
    "bic_util @ git+https://github.com/bic-mni/bic-mri-pipeline-util",
    "dcm2niix==1.0.20260416",
    "json5",
    "pydantic>=2,<3",
    "pydicom",
]

[project.optional-dependencies]
dev = [
    "pyinstaller",
    "pyrefly>=1.5",
    "ruff",
    "typos",
]
validator = [
    "bids-validator-deno==2.4.1",
]

[dependency-groups]
test = [
    "pytest>=9",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--import-mode=importlib", "--strict-config", "--strict-markers"]

[project.scripts]
mni7t_dcm2bids = "mni_7t_dicom_to_bids.scripts.run_mni7t_dcm2bids:main"

[tool.hatch.build.targets.wheel]
packages = ["src/mni_7t_dicom_to_bids"]

[tool.hatch.metadata]
allow-direct-references = true

[tool.pyrefly]
project-includes = ["src", "tests"]
preset = "strict"

[tool.pyrefly.errors]
unknown-attribute-access = "error"
unknown-attribute-type = "error"
unknown-variable-type = "error"
unknown-return-type = "error"
unknown-argument-type = "error"
unknown-from-error = "error"

[tool.ruff]
include = ["src/**/*.py", "tests/**/*.py"]
line-length = 120
preview = true

[tool.ruff.lint]
ignore = ["E203", "E221", "E241", "E251"]
# Require parameter annotations even when a default lets Pyrefly infer a type.
select = ["ANN001", "ANN002", "ANN003", "E", "F", "I", "N", "PTH", "RUF", "UP", "W"]

[tool.typos.files]
# Ignore domain-specific asset data.
extend-exclude = [
    "src/mni_7t_dicom_to_bids/assets/",
]

[tool.typos.default]
locale = "en-us"

[tool.typos.default.extend-words]
datas = "datas"  # PyInstaller attribute
ND = "ND" # DICOM series description
slient = "slient"  # DICOM series description
